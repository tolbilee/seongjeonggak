<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>성정각</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            min-height: 100dvh;
            overflow: hidden;
            font-family: "Gowun Batang", "Apple SD Gothic Neo", sans-serif;
            color: #fff;
            background: #120c10;
        }

        .hero {
            position: fixed;
            inset: 0;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .veil {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(18, 10, 14, 0.58) 0%, rgba(18, 10, 14, 0.08) 42%, transparent 68%);
            pointer-events: none;
        }

        .action {
            position: fixed;
            left: 50%;
            bottom: max(2.4rem, calc(env(safe-area-inset-bottom) + 1.4rem));
            transform: translateX(-50%);
            z-index: 2;
        }

        .caption-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 12.5rem;
            padding: 0.95rem 2.25rem;
            border-radius: 999px;
            text-decoration: none;
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #3a2430;
            background: linear-gradient(90deg, #f4e0c8, #f2d58f);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.32);
        }

        .caption-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="images/kv.jpg" alt="성정각">
        <div class="veil"></div>
    </div>
    <div class="action">
        <a class="caption-btn" href="/captions/view?roomCode=seongjeonggak">자막보기</a>
    </div>
</body>
</html>
