<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>성정각 공연 자막</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #120c10; }
        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <iframe id="captions-frame" title="공연 자막" allow="fullscreen"></iframe>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (!params.get('roomCode') && !params.get('session')) {
            params.set('roomCode', 'seongjeonggak');
        }
        const src = 'https://k-ceremony.co.kr/captions/view?' + params.toString();
        document.getElementById('captions-frame').src = src;
    </script>
</body>
</html>
